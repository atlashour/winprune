# Services that are safe to switch off on any machine.

[[item]]
id = "services.bits-manual"
name = "BITS on demand"
category = "services"
level = "medium"
risk = "low"
summary = "Sets Background Intelligent Transfer Service to manual start. Disabling it outright breaks installers and third-party updaters, so it stays available on demand."

[[item.step]]
kind = "service"
names = ["BITS"]
startup = "manual"

[[item]]
id = "services.maps-broker"
name = "Offline maps broker"
category = "services"
level = "medium"
risk = "low"
summary = "Disables the downloaded maps manager."

[[item.step]]

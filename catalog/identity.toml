# Identifiers Windows hands to Microsoft. None of this is a full identity reset; the
# hardware hash and any Entra or Microsoft account link stay as they are.

[[item]]
id = "identity.telemetry-device-id"
name = "Regenerate the telemetry device id"
category = "identity"
level = "high"
risk = "medium"
summary = "Deletes the SQM client machine id, the value shown as Device ID under Settings, About. Windows creates a fresh one on the next boot, which is what Sysprep does during generalize."
warning = "Support tooling, Insider enrolment and Microsoft diagnostics that reference the old Device ID will see a new machine. Not documented by Microsoft as a user action."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\SQMClient"
name = "MachineId"
delete = true

[[item]]
id = "identity.advertising-id-reset"
name = "Reset the advertising id"
category = "identity"
level = "high"
risk = "low"
summary = "Deletes the current user's advertising id. Combined with the advertising id policy, no new one is generated."
warning = "Apps that used the advertising id for personalisation start from a blank profile."
requires = ["privacy.advertising-id"]

[[item.step]]
kind = "registry"
hive = "hkcu"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo"
name = "Id"
delete = true

# User-scoped policies go under HKCU with scope = "all-users".

[[item]]
id = "telemetry.services"
name = "Diagnostic tracking service"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Disables the Connected User Experiences and Telemetry service (DiagTrack)."
warning = "Feedback Hub, Xbox achievements and the Windows Insider page stop working. On Intune managed devices, Windows Update for Business reports and Endpoint analytics lose their data."

[[item.step]]
kind = "service"
names = ["DiagTrack"]
startup = "disabled"

[[item]]
id = "telemetry.wap-push"
name = "Device management push router"
category = "telemetry"
level = "high"
risk = "medium"
summary = "Disables the WAP push message router (dmwappushservice) used by the MDM client."
warning = "Intune and other MDM enrolment stop syncing without any error, and Sysprep hangs. Keep it on managed or imaged machines."

[[item.step]]
kind = "service"
names = ["dmwappushservice"]
startup = "disabled"

[[item]]
id = "telemetry.policy"
name = "Diagnostic data policy"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Sets diagnostic data to the lowest level the edition allows (Security on Enterprise and Education, Required elsewhere), keeps the device name out of it and limits log and dump uploads."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "AllowTelemetry"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\DataCollection"
name = "AllowTelemetry"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "AllowDeviceNameInTelemetry"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "LimitDiagnosticLogCollection"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "LimitDumpCollection"
type = "dword"
value = 1

[[item]]
id = "telemetry.onesettings"
name = "OneSettings downloads"
category = "telemetry"
level = "high"
risk = "low"
summary = "Stops the device from fetching configuration from the OneSettings service."
warning = "Microsoft uses OneSettings to switch off broken diagnostic events remotely. Without it that safety valve is gone."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection"
name = "DisableOneSettingsDownloads"
type = "dword"
value = 1

[[item]]
id = "telemetry.tasks"
name = "Telemetry scheduled tasks"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Disables the Customer Experience Improvement Program, feedback, disk diagnostic upload and app inventory backup tasks."

[[item.step]]
kind = "task"
action = "disable"
patterns = [
    "\\Microsoft\\Windows\\Customer Experience Improvement Program\\*",
    "\\Microsoft\\Windows\\Application Experience\\ProgramDataUpdater",
    "\\Microsoft\\Windows\\Application Experience\\StartupAppTask",
    "\\Microsoft\\Windows\\Application Experience\\MareBackup",
    "\\Microsoft\\Windows\\Autochk\\Proxy",
    "\\Microsoft\\Windows\\DiskDiagnostic\\Microsoft-Windows-DiskDiagnosticDataCollector",
    "\\Microsoft\\Windows\\Feedback\\Siuf\\DmClient*",
]

[[item]]
id = "telemetry.appraiser"
name = "Compatibility appraiser and device census"
category = "telemetry"
level = "high"
risk = "medium"
summary = "Disables the compatibility appraiser (CompatTelRunner) and the device census tasks that inventory hardware and apps for Microsoft."
warning = "Windows Update uses the appraiser results to offer feature updates and apply safeguard holds. With these off the next Windows version may never be offered through Windows Update."

[[item.step]]
kind = "task"
action = "disable"
patterns = [
    "\\Microsoft\\Windows\\Application Experience\\Microsoft Compatibility Appraiser",
    "\\Microsoft\\Windows\\Application Experience\\Microsoft Compatibility Appraiser Exp",
    "\\Microsoft\\Windows\\Device Information\\Device",
    "\\Microsoft\\Windows\\Device Information\\Device User",
]

[[item]]
id = "telemetry.flighting-usage"
name = "Feature usage reporting"
category = "telemetry"
level = "high"
risk = "low"
summary = "Disables the usage reporting tasks of the controlled feature rollout system. The rollout tasks themselves stay on so kill switches for broken features still arrive."
warning = "Nothing visible changes. Listed at high because these tasks are part of the update plumbing. Windows has been seen turning UsageDataReporting and UsageDataFlushing back on within weeks; winprune diff shows when that happens."

[[item.step]]
kind = "task"
action = "disable"
patterns = [
    "\\Microsoft\\Windows\\Flighting\\FeatureConfig\\UsageDataReporting",
    "\\Microsoft\\Windows\\Flighting\\FeatureConfig\\UsageDataFlushing",
    "\\Microsoft\\Windows\\Flighting\\FeatureConfig\\BootstrapUsageDataReporting",
]

[[item]]
id = "telemetry.cortana-policy"
name = "Cortana policy"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Turns Cortana off by policy so search does not talk to it. A no-op on 24H2 where Cortana is gone."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search"
name = "AllowCortana"
type = "dword"
value = 0

[[item]]
id = "telemetry.copilot-policy"
name = "Copilot policy and taskbar button"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Applies the user-scoped Turn off Windows Copilot policy and hides the 23H2 taskbar button. Microsoft has deprecated the policy and it does not touch the Copilot app on 24H2, which the Copilot app item removes."

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\WindowsCopilot"
name = "TurnOffWindowsCopilot"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
name = "ShowCopilotButton"
type = "dword"
value = 0

[[item]]
id = "telemetry.recall-policy"
name = "Recall and Click to Do"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Disables Recall snapshots, removes the Recall feature bits, disables Click to Do and sets the AI fabric service to manual. A no-op on machines without Copilot+ hardware."
windows = { min_build = 26100 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "DisableAIDataAnalysis"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "DisableAIDataAnalysis"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "AllowRecallEnablement"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "DisableClickToDo"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "DisableClickToDo"
type = "dword"
value = 1

[[item.step]]
kind = "service"
names = ["WSAIFabricSvc"]
startup = "manual"

# WindowsCopilot.admx (26300) supports it on Pro, Enterprise and Education; the
# WindowsAI Policy CSP page lists it as Insider only for now.
[[item]]
id = "telemetry.settings-agent"
name = "Settings agent"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Turns off the AI agent that answers natural language searches in Settings. Settings keeps its normal search. A no-op on machines without Copilot+ hardware."
windows = { min_build = 26100 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI"
name = "DisableSettingsAgent"
type = "dword"
value = 1

[[item]]
id = "telemetry.app-ai"
name = "AI features in Notepad and Paint"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Turns off Copilot in Notepad and the generative features in Paint by policy."
windows = { min_build = 22000 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\WindowsNotepad"
name = "DisableAIFeatures"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Paint"
name = "DisableCocreator"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Paint"
name = "DisableGenerativeFill"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Paint"
name = "DisableImageCreator"
type = "dword"
value = 1

# AppPrivacy.admx (26300), Settings > Privacy > Text and image generation.
# 0 user in control, 1 force allow, 2 force deny, as for every LetAppsAccess policy.
[[item]]
id = "telemetry.system-ai-models"
name = "App access to the Windows AI models"
category = "telemetry"
level = "high"
risk = "medium"
summary = "Denies every app access to the on-device text and image generation models of Windows by policy."
warning = "Apps built on the Windows AI APIs lose their generative features, and the switch in Settings is locked. That includes the Local AI Manager that Microsoft 365 registers (package aimgr), which Office puts back on update; this policy is what keeps it away from the models."
windows = { min_build = 26100 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\AppPrivacy"
name = "LetAppsAccessSystemAIModels"
type = "dword"
value = 2

[[item]]
id = "telemetry.error-reporting"
name = "Windows Error Reporting"
category = "telemetry"
level = "high"
risk = "low"
summary = "Disables Windows Error Reporting uploads by policy and the task that drains the report queue at sign-in. The service stays; local crash dumps and Reliability Monitor keep working."
warning = "Crash reports stop being sent to Microsoft, and the dialog that offers an online solution goes away."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Error Reporting"
name = "Disabled"
type = "dword"
value = 1

[[item.step]]
kind = "task"
action = "disable"
patterns = ["\\Microsoft\\Windows\\Windows Error Reporting\\QueueReporting"]

[[item]]
id = "telemetry.input"
name = "Typing, inking and speech data"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Stops Windows from sending typing and handwriting samples, contact harvesting for personalisation, and online speech recognition data."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\TextInput"
name = "AllowLinguisticDataCollection"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\InputPersonalization"
name = "AllowInputPersonalization"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\InputPersonalization"
name = "RestrictImplicitTextCollection"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\InputPersonalization"
name = "RestrictImplicitInkCollection"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\TabletPC"
name = "PreventHandwritingDataSharing"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Input\\TIPC"
name = "Enabled"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\InputPersonalization"
name = "RestrictImplicitTextCollection"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\InputPersonalization"
name = "RestrictImplicitInkCollection"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\InputPersonalization\\TrainedDataStore"
name = "HarvestContacts"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Personalization\\Settings"
name = "AcceptedPrivacyPolicy"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Speech_OneCore\\Settings\\OnlineSpeechPrivacy"
name = "HasAccepted"
type = "dword"
value = 0

# Task description on 26300: "Telemetry events for sustainability" (COM handler
# {6EE41D75-D091-4FB7-9AD5-018760DD25D4}). PowerGridForecastTask in the same folder only
# says it has a COM task handler; nothing shows it is telemetry, so it stays.
[[item]]
id = "telemetry.sustainability"
name = "Sustainability telemetry task"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Disables the scheduled task that sends sustainability telemetry events. The other task in that folder is left alone."

[[item.step]]
kind = "task"
action = "disable"
patterns = ["\\Microsoft\\Windows\\Sustainability\\SustainabilityTelemetry"]

# Task description on 26300: "Performance feedback (Microsoft internal)" (COM handler
# {6A719579-5695-469F-832A-C96B471842F6}). WhesvcToast in the same folder shows the notice
# after a trace captured with the hotkey, which a person asked for; it stays.
[[item]]
id = "telemetry.performance-feedback"
name = "Performance feedback toast"
category = "telemetry"
level = "medium"
risk = "low"
summary = "Disables the scheduled task that asks for feedback about performance traces."

[[item.step]]
kind = "task"
action = "disable"
patterns = ["\\Microsoft\\Windows\\PerformanceTrace\\ShowFeedbackToast"]

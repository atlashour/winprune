[[item]]
id = "privacy.tailored-experiences"
name = "Tailored experiences"
category = "privacy"
level = "medium"
risk = "low"
summary = "Stops Windows from using diagnostic data to personalise tips and ads, and blocks third-party suggestions in Spotlight. Both policies are user-scoped and are written for every profile."

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableTailoredExperiencesWithDiagnosticData"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableThirdPartySuggestions"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Privacy"
name = "TailoredExperiencesWithDiagnosticDataEnabled"
type = "dword"
value = 0

[[item]]
id = "privacy.spotlight"
name = "Windows Spotlight"
category = "privacy"
level = "high"
risk = "low"
summary = "Turns off Windows Spotlight on the lock screen, its tips and its welcome experience by user policy. Enterprise and Education only; Pro and Home ignore it."
warning = "The lock screen falls back to a static picture. On Pro and Home nothing changes."

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableWindowsSpotlightFeatures"
type = "dword"
value = 1


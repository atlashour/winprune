# CloudContent policies only count on Enterprise/Education; the HKCU toggles are what
# works on Pro and Home, so both are written.

[[item]]
id = "privacy.consumer-features"
name = "Sponsored apps and tips policy"
category = "privacy"
level = "medium"
risk = "low"
summary = "Sets the CloudContent policies against promoted app installs, tips and account-state content. Enterprise and Education honour them; on Pro and Home the per-user suggestion switches below do the work."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableWindowsConsumerFeatures"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableConsumerAccountStateContent"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableSoftLanding"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent"
name = "DisableCloudOptimizedContent"
type = "dword"
value = 1

[[item]]
id = "privacy.device-metadata"
name = "Device metadata downloads"
category = "privacy"
level = "medium"
risk = "low"
summary = "Stops Windows from fetching device metadata and OEM companion apps from the internet when hardware is plugged in."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Device Metadata"
name = "PreventDeviceMetadataFromNetwork"
type = "dword"
value = 1

[[item]]
id = "privacy.advertising-id"
name = "Advertising id"
category = "privacy"
level = "medium"
risk = "low"
summary = "Disables the advertising id by policy, machine-wide and for every user profile."

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo"
name = "DisabledByGroupPolicy"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo"
name = "Enabled"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\AdvertisingInfo"
name = "Enabled"
type = "dword"
value = 0


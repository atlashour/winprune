[[item]]
id = "appx.promoted-third-party"
name = "Promoted third-party apps"
category = "appx"
level = "medium"
risk = "low"
summary = "Removes sponsored packages that consumer and OEM images preinstall (Spotify, TikTok, Disney, games). Absent on clean images."

[[item.step]]
kind = "appx"
patterns = [
    "*SpotifyAB*", "*CandyCrush*", "*king.com*", "*Disney*", "*Facebook*", "*Instagram*",
    "*TikTok*", "*Netflix*", "*LinkedInforWindows*", "*AmazonVideo*", "*PrimeVideo*",
    "*Duolingo*", "*Roblox*", "*BytedancePte*", "*Twitter*", "*Hulu*", "*Dolby*",
    "*McAfee*", "*Booking*", "*ESPN*", "*Messenger*", "*WhatsApp*",
]

[[item]]
id = "appx.store-policy"
name = "Keep removed apps out of new profiles (24H2+)"
category = "appx"
level = "medium"
risk = "low"
summary = "Sets the Windows 11 24H2 policy that removes default Store packages when a new user profile is created."
windows = { min_build = 26100 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages"
name = "Enabled"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages\\Clipchamp.Clipchamp_yxz26nhyzhsrt"
name = "RemovePackage"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages\\Microsoft.BingNews_8wekyb3d8bbwe"

# Preinstalled apps. Patterns are globs against the package name (not the family name),
# so a rename that keeps the stem still matches. Non-removable packages are skipped by
# the engine, never listed here.

[[item]]
id = "appx.cortana"
name = "Cortana"
category = "appx"
level = "medium"
risk = "low"
summary = "Removes the Cortana app package."

[[item.step]]
kind = "appx"
patterns = ["*549981C3F5F10*", "*Microsoft.Cortana*"]


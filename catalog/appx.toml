[[item.step]]
kind = "appx"
patterns = [
    "*SpotifyAB*", "*CandyCrush*", "*king.com*", "*Disney*", "*Facebook*", "*Instagram*",
    "*TikTok*", "*Netflix*", "*LinkedInforWindows*", "*Amazon.com.Amazon*", "*AmazonVideo*",
    "*PrimeVideo*", "*Duolingo*", "*Roblox*", "*BytedancePte*", "*Twitter*", "*Hulu*",
    "*Flipboard*", "*PandoraMediaInc*", "*iHeartRadio*", "*AdobePhotoshopExpress*",
    "*EclipseManager*", "*ActiproSoftwareLLC*", "*TuneInRadio*", "*SlingTV*", "*Asphalt*",
    "*HiddenCity*", "*MarchofEmpires*", "*FarmVille*", "*CaesarsSlots*", "*COOKINGFEVER*",
]

# Windows 11 24H2 policy that removes inbox Store packages when a profile is created or at
# the next sign-in. Microsoft supports it on Enterprise and Education only; on Pro and Home
# it is written all the same and does nothing. Only families from Microsoft's static list
# are used here. The engine writes the classic Deprovisioned key for every deprovisioned
# family regardless of edition, which is what actually keeps apps out of new profiles.

[[item]]
id = "appx.store-policy"
name = "Store package policy for new profiles (24H2+, Enterprise and Education)"
category = "appx"
level = "medium"
risk = "low"
summary = "Sets the 24H2 policy that removes default Store packages for new user profiles. Honoured on Enterprise and Education; a no-op on Pro and Home."
windows = { min_build = 26100 }

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages"
name = "Enabled"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages\\Clipchamp.Clipchamp_yxz26nhyzhsrt"
name = "RemovePackage"
type = "dword"
value = 1

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\Appx\\RemoveDefaultMicrosoftStorePackages\\Microsoft.BingNews_8wekyb3d8bbwe"
name = "RemovePackage"
type = "dword"
value = 1


[[item]]
id = "appx.copilot"
name = "Copilot app"
category = "appx"
level = "high"
risk = "low"
summary = "Removes the Copilot app package. The policy that turns Copilot off is a separate item."
warning = "Windows may reinstall the package through Store updates unless the Copilot policy is also applied."
requires = ["telemetry.copilot-policy"]

[[item.step]]
kind = "appx"
patterns = ["*Microsoft.Copilot*", "*Windows.Ai.Copilot.Provider*", "*Microsoft.Windows.Ai.Copilot*"]


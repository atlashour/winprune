# Preinstalled apps. Patterns are globs against the package name (not the family name),
# so a rename that keeps the stem still matches. Packages Windows marks as part of the
# OS are skipped by the engine, never listed here. Anything that also removes local
# user data (Sticky Notes) or that other Windows features lean on (Get Help, Xbox
# identity) sits at high or max with a warning.

[[item]]
id = "appx.cortana"
name = "Cortana"
category = "appx"
level = "medium"
risk = "low"
summary = "Removes the Cortana app. Gone from Windows 11 24H2 media, so it reports absent there."

[[item.step]]
kind = "appx"
patterns = ["*549981C3F5F10*"]

[[item]]
id = "appx.tips"
name = "Tips"
category = "appx"
level = "medium"
risk = "low"
summary = "Removes the Tips app (package name Getstarted). The Windows 11 Get Started page lives in a system component and stays."

[[item.step]]
kind = "appx"
patterns = ["*Getstarted*"]

[[item]]
id = "appx.get-help"
name = "Get Help"
category = "appx"
level = "high"
risk = "medium"
summary = "Removes the Get Help app."
warning = "Windows 11 troubleshooters and the Settings support links open through Get Help. Without it they fail."

[[item.step]]
kind = "appx"
patterns = ["*GetHelp*"]


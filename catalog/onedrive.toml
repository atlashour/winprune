# Uninstall never touches the user's OneDrive folder; that is its own max item.

[[item]]
id = "onedrive.uninstall"
name = "Uninstall OneDrive"
category = "onedrive"
level = "high"
risk = "medium"
summary = "Stops OneDrive, runs the official uninstaller, removes leftovers in every profile and in ProgramData, the autostart and first-sign-in setup entries, the Explorer sidebar entry and the update tasks, then blocks it by policy."
warning = "Sync stops. Files already downloaded stay in the OneDrive folder; files marked online-only become unavailable until OneDrive is reinstalled. A per-machine install is reported, not removed."

[[item.step]]
kind = "kill"
processes = ["OneDrive", "OneDrive.Sync.Service", "FileCoAuth"]

[[item.step]]
kind = "run"
candidates = ["%SystemRoot%\\SysWOW64\\OneDriveSetup.exe", "%SystemRoot%\\System32\\OneDriveSetup.exe"]
args = ["/uninstall"]
# 0x8004069B: the setup found no OneDrive to uninstall for this account.
skip_exit_codes = [-2147219813]
# OneDriveSetup.exe stays in the system folder after uninstalling, so its presence says
# nothing. The client files cannot tell either: the delete step below removes them, so
# a failed uninstall would then look done. These values are what a per-user install
# keeps registered; after an uninstall the Uninstall entry is gone and the OneDrive key
# loses Version (seen on 26300). A run step reads user-scope probes for the account the
# command runs as, which is the one the uninstaller acts for.
when_registered = [
    { hive = "hkcu", path = "Software\\Microsoft\\OneDrive", name = "Version" },
    { hive = "hkcu", path = "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\OneDriveSetup.exe", name = "UninstallString" },
]

# A per-machine install (OneDriveSetup.exe /allusers), detected the way Microsoft does:
# https://learn.microsoft.com/sharepoint/per-machine-installation
# Microsoft documents no way to uninstall it, so it is reported and left in place.
[[item.step]]
kind = "unsupported"
reason = "OneDrive installed for all users (per-machine)"
when_registered = [
    { hive = "hklm", path = "SOFTWARE\\Microsoft\\OneDrive", name = "Version" },
    { hive = "hklm", path = "SOFTWARE\\WOW6432Node\\Microsoft\\OneDrive", name = "Version" },
]

[[item.step]]
kind = "delete"
scope = "all-users"
paths = [
    "%LOCALAPPDATA%\\Microsoft\\OneDrive",
    "%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\OneDrive.lnk",
]

[[item.step]]
kind = "delete"
paths = ["%PROGRAMDATA%\\Microsoft OneDrive", "C:\\OneDriveTemp"]

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Run"
name = "OneDrive"
delete = true

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Run"
name = "OneDriveSetup"
delete = true

[[item.step]]
kind = "registry"
hive = "hkcu"
scope = "all-users"
path = "Software\\Classes\\CLSID\\{018D5C66-4533-4307-9B53-224DE2ED1FE6}"
name = "System.IsPinnedToNameSpaceTree"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcr"
path = "CLSID\\{018D5C66-4533-4307-9B53-224DE2ED1FE6}"
name = "System.IsPinnedToNameSpaceTree"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcr"
path = "Wow6432Node\\CLSID\\{018D5C66-4533-4307-9B53-224DE2ED1FE6}"
name = "System.IsPinnedToNameSpaceTree"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\OneDrive"
name = "DisableFileSyncNGSC"
type = "dword"
value = 1

[[item.step]]
kind = "task"
action = "delete"
patterns = ["\\OneDrive*"]

[[item]]
id = "onedrive.delete-user-folder"
name = "Delete the OneDrive folder"
category = "onedrive"
level = "max"
risk = "high"
summary = "Deletes the OneDrive folder of the user who started winprune. For kiosks that never had data there."
warning = "Everything in the OneDrive folder is deleted from this machine. Files not fully synced to the cloud are lost."
requires = ["onedrive.uninstall"]

[[item.step]]
kind = "delete"
paths = ["%USERPROFILE%\\OneDrive"]

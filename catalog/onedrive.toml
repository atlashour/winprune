# Uninstalling OneDrive never touches the user's OneDrive folder. Deleting that folder
# is a separate max-level item whose warning carries the live file count.

[[item]]
id = "onedrive.uninstall"
name = "Uninstall OneDrive"
category = "onedrive"
level = "high"
risk = "medium"
summary = "Stops OneDrive, runs the official uninstaller, removes leftovers in AppData and ProgramData, the autostart entry, the Explorer sidebar entry and the update tasks, then blocks it by policy."
warning = "Sync stops. Files already downloaded stay in the OneDrive folder; files marked online-only become unavailable until OneDrive is reinstalled."

[[item.step]]
kind = "kill"
processes = ["OneDrive", "FileCoAuth"]

[[item.step]]
kind = "run"
candidates = ["%SystemRoot%\\SysWOW64\\OneDriveSetup.exe", "%SystemRoot%\\System32\\OneDriveSetup.exe"]
args = ["/uninstall"]

[[item.step]]
kind = "delete"
paths = [
    "%LOCALAPPDATA%\\Microsoft\\OneDrive",
    "%PROGRAMDATA%\\Microsoft OneDrive",
    "C:\\OneDriveTemp",
    "%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\OneDrive.lnk",
]

[[item.step]]
kind = "registry"
hive = "hkcu"
path = "Software\\Microsoft\\Windows\\CurrentVersion\\Run"
name = "OneDrive"
delete = true

[[item.step]]
kind = "registry"
hive = "hkcr"
path = "CLSID\\{018D5C66-4533-4307-9B53-224DE2ED1FE6}"
name = "System.IsPinnedToNameSpaceTree"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hkcr"
path = "Wow6432Node\\CLSID\\{018D5C66-4533-4307-9B53-224DE2ED1FE6}"
name = "System.IsPinnedToNameSpaceTree"
type = "dword"
value = 0

[[item.step]]
kind = "registry"
hive = "hklm"
path = "SOFTWARE\\Policies\\Microsoft\\Windows\\OneDrive"
name = "DisableFileSyncNGSC"
type = "dword"
value = 1

[[item.step]]
kind = "task"
action = "delete"
patterns = ["\\OneDrive*"]

[[item]]
id = "onedrive.delete-user-folder"
name = "Delete the OneDrive folder"
category = "onedrive"
level = "max"
risk = "high"
summary = "Deletes the OneDrive folder in the user profile. For kiosks that never had data there."
warning = "Everything in the OneDrive folder is deleted from this machine. Files not fully synced to the cloud are lost."
requires = ["onedrive.uninstall"]

[[item.step]]
kind = "delete"
paths = ["%USERPROFILE%\\OneDrive"]
